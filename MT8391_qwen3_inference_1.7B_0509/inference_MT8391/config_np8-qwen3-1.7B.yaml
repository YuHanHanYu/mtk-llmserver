modelOptions:
  # Qwen3-1.7B (HuggingFace: hidden 2048, 28 layers, 16 heads, head_dim 128)
  # 与 Qwen3-4B 的 36 层相比，KV 输入少 (36-28)*2=16 个，对应 DLA 常见 61 vs 77 输入差异
  promptTokenBatchSize: 128
  cacheSize: 4096
  hiddenSize: 2048
  numHead: 16
  numLayer: 28
  headDim: 128
  maxTokenLength: 32768
  modelInputType: INT16
  modelOutputType: INT16
  cacheType: INT16
  maskType: INT16
  rotEmbType: INT16
  rotEmbBase: 1000000.0
  splitMask: True

runtimeOptions:
  startTokenIndex: 0
  specialTokens:
    bosId: 151643
    eosId: 151645
    addBos:
    stopToken:
  tokenizerPath:
    - /data/local/tmp/llm_sdk/Qwen3-1.7B_0509/tokenizer/vocab.txt
    - /data/local/tmp/llm_sdk/Qwen3-1.7B_0509/tokenizer/merges.txt
    - /data/local/tmp/llm_sdk/Qwen3-1.7B_0509/tokenizer/added_tokens.yaml

  tokenEmbPath: /data/local/tmp/llm_sdk/Qwen3-1.7B_0509/tokenizer/embedding_int16.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/Qwen3-1.7B_0509/2048c/dynamic_tflite_output_128t4096c_0.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/Qwen3-1.7B_0509/2048c/dynamic_tflite_output_1t4096c_0.dla
